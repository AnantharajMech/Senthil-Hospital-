<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senthil Hospital - Reset Password</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <style>
        :root{--p:#06B6D4;--pp:#8B5CF6;--bg:#F8FAFC;--s:#FFF;--m:#64748B;--a:#10B981;--d:#F43F5E}
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(135deg,var(--bg),#E0F2FE);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui}
        .c{width:100%;max-width:480px}
        .h{text-align:center;margin-bottom:25px}
        .h h1{font-size:24px;font-weight:800}
        .card{background:var(--s);border-radius:18px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.04)}
        .ig{position:relative;margin-bottom:16px}
        .ig l{display:block;font-size:12px;font-weight:600;color:var(--m);margin-bottom:6px}
        .ig input{width:100%;padding:14px;border:2px solid #E2E8F0;border-radius:12px;font-size:14px}
        .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-p{background:var(--p);color:#fff}
        .btn-a{background:var(--pp);color:#fff}
        .e,.s{padding:12px;border-radius:10px;margin-bottom:12px;font-size:13px;font-weight:600;display:none;text-align:center}
        .e.show,.s.show{display:block}
        .e{background:rgba(244,63,94,.1);color:var(--d)}
        .s{background:rgba(16,185,129,.1);color:var(--a)}
        .sp{width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .bd{background:var(--pp);color:#fff;padding:5px 14px;border-radius:22px;font-size:11px;font-weight:700;margin-bottom:12px;display:inline-block}
        .info-box{background:rgba(6,182,212,.1);border:1px solid rgba(6,182,212,.2);border-radius:10px;padding:12px;margin-bottom:16px;font-size:12px;color:var(--m);text-align:center}
        .lnk{color:var(--p);font-weight:700;cursor:pointer;text-decoration:underline;font-size:13px;background:none;border:none}
        .lnk-pp{color:var(--pp);font-weight:700;cursor:pointer;text-decoration:underline;font-size:13px;background:none;border:none}
        .success-box{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:10px;padding:20px;text-align:center;display:none}
        .success-box.show{display:block}
        .success-box h2{color:var(--a);margin-bottom:10px;font-size:18px}
        .success-box p{color:var(--m);font-size:13px}
    </style>
</head>
<body>
    <div class="c">
        <div class="h"><h1>Senthil Healthcare</h1></div>
        
        <!-- RESET PASSWORD FORM -->
        <div class="card">
            <div class="bd">Password Reset</div>
            <div id="reset-container">
                <div class="info-box">Enter your new password below</div>
                <div class="e" id="reset-error"></div>
                <div class="s" id="reset-success"></div>
                
                <div class="ig"><l>New Password</l><input type="password" id="new-password" placeholder="Enter new password"></div>
                <div class="ig"><l>Confirm Password</l><input type="password" id="confirm-password" placeholder="Confirm password"></div>
                <button class="btn btn-p" id="reset-btn">Reset Password</button>
                <button class="lnk" id="back-to-login" style="width:100%;margin-top:10px">Back to Login</button>
            </div>
            
            <!-- SUCCESS MESSAGE -->
            <div class="success-box" id="success-box">
                <h2>✓ Password Reset Successfully</h2>
                <p>Your password has been changed. You can now login with your new password.</p>
                <button class="btn btn-p" id="goto-login" style="margin-top:15px">Go to Login</button>
            </div>
        </div>
    </div>

    <script>
        const fc={apiKey:"AIzaSyCD3Ec4EDyZCpgP_cEMsNgq0yl0mSktKLw",authDomain:"senthil-hospital.firebaseapp.com",projectId:"senthil-hospital",storageBucket:"senthil-hospital.firebasestorage.app",messagingSenderId:"982153290551",appId:"1:982153290551:web:5b9fa11ffe7b9f6f5f30b2"};
        firebase.initializeApp(fc);
        const auth=firebase.auth();

        // Get the reset code from URL
        const urlParams=new URLSearchParams(window.location.search);
        const resetCode=urlParams.get('oobCode');
        const userType=urlParams.get('type')||'customer'; // 'customer' or 'admin'

        // Verify the reset code
        if(!resetCode){
            document.getElementById("reset-error").textContent="Invalid or expired reset link. Please request a new one.";
            document.getElementById("reset-error").classList.add("show");
            document.getElementById("reset-container").style.display="none";
        }

        function err(id,msg){
            const el=document.getElementById(id);
            el.textContent=msg;
            el.classList.add("show");
            setTimeout(()=>el.classList.remove("show"),5000);
        }

        function succ(id,msg){
            const el=document.getElementById(id);
            el.textContent=msg;
            el.classList.add("show");
        }

        // Reset Password
        document.getElementById("reset-btn").onclick=async function(){
            const newPass=document.getElementById("new-password").value;
            const confirmPass=document.getElementById("confirm-password").value;

            if(!newPass||!confirmPass){
                err("reset-error","Fill all fields");
                return;
            }

            if(newPass!==confirmPass){
                err("reset-error","Passwords do not match");
                return;
            }

            if(newPass.length<6){
                err("reset-error","Password must be at least 6 characters");
                return;
            }

            this.disabled=true;
            this.innerHTML="<div class=sp></div> Resetting...";

            try{
                // Confirm password reset
                await auth.confirmPasswordReset(resetCode,newPass);
                
                // Show success message
                document.getElementById("reset-container").style.display="none";
                document.getElementById("success-box").classList.add("show");
            }catch(e){
                let msg="Failed to reset password";
                if(e.code==="auth/invalid-action-code"){
                    msg="Reset link has expired. Please request a new one.";
                }else if(e.code==="auth/user-disabled"){
                    msg="This account has been disabled.";
                }
                err("reset-error",msg);
                this.disabled=false;
                this.innerHTML="Reset Password";
            }
        };

        // Back to Login
        document.getElementById("back-to-login").onclick=()=>{
            window.location.href="login-auth.html";
        };

        // Go to Login from success
        document.getElementById("goto-login").onclick=()=>{
            window.location.href="login-auth.html";
        };
    </script>
</body>
</html>
